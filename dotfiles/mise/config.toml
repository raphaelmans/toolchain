[settings]
minimum_release_age = "0s"

[env]
# Tools that update themselves: let mise own updates instead
DISABLE_AUTOUPDATER = "1"        # Claude Code
GROK_DISABLE_AUTOUPDATER = "1"   # Grok CLI

[tools]
# Runtimes
node   = "26"
pnpm   = "10"
bun    = "1"
python = "3.14"
ruby   = "3.4"
rust   = "stable"
uv     = "0.13"
go     = "1.27"
deno   = "2"

# AI and agent CLIs (fast-moving)
"npm:@openai/codex" = "latest"
claude = "latest"
grok = { version = "latest", bin = "grok", platforms = { windows-arm64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-aarch64.exe" }, windows-x64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe" } }, url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }
"npm:@fission-ai/openspec" = "1"
"github:herdrdev/herdr" = "latest"
"github:vercel-labs/agent-desktop" = "latest"
agent-browser = "latest"
"npm:openclaw" = "latest"
"github:runkids/skillshare" = "latest"
"pipx:tools-registry[proxy]" = "latest"
"pipx:nano-pdf" = "latest"
"npm:t3" = { version = "latest", os = ["linux"] }

# Developer CLIs
gh        = "2"
ripgrep   = "15"
fd        = "10"
fzf       = "latest"
lazygit   = "latest"
neovim    = "0.12"
tmux      = "3"
jq        = "1"
direnv    = "2"
worktrunk = "latest"
"npm:turbo" = "2"
"npm:defuddle" = "latest"
"npm:portless" = "latest"
"npm:@playwright/cli" = "latest"
"npm:playwright-cli" = "latest"
"npm:obsidian-headless" = "latest"

# Cloud and services
supabase = "3"
stripe   = "1"
aws-cli  = "2"
kubectl  = "latest"
gcloud   = "latest"
# Vercel stopped npm provenance on its native builds at 58.7.0 (2026-08-05); all still published by
# vercel/vercel GitHub Actions. Reviewed 2026-11-17. Exact versions only: re-review on each new release.
"npm:vercel" = { version = "65.16.0", trust_policy_excludes = ["@vercel/vc-native-linux-x64@65.16.0", "@vercel/vc-native-win32-x64@65.16.0", "@vercel/vc-native-darwin-x64@65.16.0", "@vercel/vc-native-linux-arm64@65.16.0", "@vercel/vc-native-win32-arm64@65.16.0", "@vercel/vc-native-darwin-arm64@65.16.0", "@vercel/vc-native-linux-x64-musl@65.16.0", "@vercel/vc-native-linux-arm64-musl@65.16.0", "@vercel/backends@26.0.0", "@vercel/build-utils@15.4.0", "@vercel/cli-auth@0.4.2", "@vercel/cli-config@0.4.0", "@vercel/container@26.0.0", "@vercel/detect-agent@1.2.7", "@vercel/elysia@26.0.0", "@vercel/express@26.0.0", "@vercel/fastify@26.0.0", "@vercel/go@29.0.0", "@vercel/h3@26.0.0", "@vercel/hono@26.0.0", "@vercel/hydrogen@27.0.0", "@vercel/koa@26.0.0", "@vercel/nestjs@26.0.0", "@vercel/next@30.0.0", "@vercel/node@31.0.0", "@vercel/python@32.0.0", "@vercel/python-analysis@0.15.3", "@vercel/redwood@28.0.0", "@vercel/remix-builder@31.0.0", "@vercel/ruby@28.0.0", "@vercel/rust@27.0.0", "@vercel/static-build@28.0.0", "@vercel/static-config@3.4.4", "@vercel/oidc@3.8.10", "@vercel/cervel@0.1.94", "@vercel/error-utils@2.2.1", "@vercel/gatsby-plugin-vercel-analytics@1.0.12", "@vercel/gatsby-plugin-vercel-builder@2.2.86", "@vercel/cli-config@0.3.1", "@vercel/cli-exec@1.0.1", "@vercel/detect-agent@1.2.5", "@vercel/oidc@4.0.0"] }
"npm:ntn" = "latest"
rclone   = "1"
dotenvx  = "2"
yt-dlp   = "latest"
opencode = "latest"
